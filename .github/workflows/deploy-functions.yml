name: Deploy Cloud Functions

on:
  push:
    branches: [claude/loving-wright-Gx3KB]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.firebaserc'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install functions dependencies
        run: cd functions && npm ci

      - name: Build functions
        run: cd functions && npm run build

      - name: Deploy to Firebase
        run: npx firebase-tools@latest deploy --only functions --token "${{ secrets.FIREBASE_TOKEN }}" --project ets-vandaele --non-interactive --force
